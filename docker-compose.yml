version: '3.8'

services:
  invoiceiq-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invoiceiq_engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - SQLITE_DB_PATH=/app/data/invoiceiq.db
      - LOG_LEVEL=INFO
    volumes:
      - invoiceiq_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  invoiceiq_data:
    driver: local
